# 住宅資産形成シミュレーション 設定ファイル
# config.toml にコピーして値を編集してください（config.toml は gitignore 済み）

# --- エリア ---
area = "中野"                  # エリアプリセット（浦和美園/小岩/浦和/中野/文京区）

# --- 世帯プロファイル ---
husband_age = 35             # 夫の開始年齢（20〜45歳）
wife_age = 32                # 妻の開始年齢（20〜45歳）
marriage_age = 30             # 夫の結婚年齢
husband_income = 50.0         # 夫の月額手取り（万円）
wife_income = 44.0            # 妻の月額手取り（万円）

# --- 資産 ---
husband_savings = 800        # 夫の婚前資産（万円、特有財産）
wife_savings = 400           # 妻の婚前資産（万円、特有財産）
shared_savings = 600         # 共有資産（万円、婚後の共有財産）

# --- 新NISA（2024年〜恒久非課税）既投資分 ---
# 旧NISA（一般/つみたて）は非課税期間終了後に特定口座へ移管されるため含めない
husband_nisa_used = 360      # 夫の新NISA既投資元本（万円、生涯枠消費済み額）
husband_nisa_balance = 400   # 夫の新NISA現在評価額（万円、省略時=元本と同額）
wife_nisa_used = 200         # 妻の新NISA既投資元本（万円）
wife_nisa_balance = 220      # 妻の新NISA現在評価額（万円）

# --- 子供・教育 ---
children = [35]              # 出産時の妻の年齢（[] で子なし、最大2人）
education_private_from = "中学"  # 私立切替ステージ: ""=全国公立, "中学", "高校", "大学"
education_field = "理系"         # 進路: "理系", "文系"
education_boost = 1.0            # 受験年費用倍率: 0.8=節約, 1.0=標準, 1.2=積極
education_grad = "修士"          # 最終学歴: "学部"(22歳独立), "修士"(24歳), "博士"(27歳)

# --- 生活費・車・ペット ---
living_premium = 10.0         # 生活費プレミアム（年齢別ベースラインへの上乗せ、万円/月）
car = false                  # 車所有（購入300万/7年買替+維持費5万/月）
pets = [37]                  # ペット迎え入れ時の夫の年齢（[] でペットなし、1匹15年）

# --- 就労・転勤 ---
husband_work_end_age = 70    # 夫の就労終了年齢
wife_work_end_age = 65       # 妻の就労終了年齢
relocation = false           # 転勤族モード（転勤確率が年3%→10%に上昇）

# --- 特別支出 ---
special_expenses = [[71, 2000, "飛鳥世界一周"]]  # [年齢, 金額(万円), ラベル]（2026年価値）

# --- バケット戦略（デフォルト: 安全資産5年分/現金2年/ゴールド10%/退職5年前から移行） ---
# bucket_safe_years = 0      # 0にすると無効化（全額株式）
